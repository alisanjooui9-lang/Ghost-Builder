<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ghost Builder — رسانه‌ها</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .media-page {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .media-header {
      max-width: 1200px;
      margin: auto;
      padding: 28px 18px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .media-title h1 {
      margin: 0;
      font-size: 26px;
    }

    .media-title p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .media-container {
      max-width: 1200px;
      margin: auto;
      padding: 0 18px;
    }

    .media-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .media-stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .media-stat-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .media-stat strong {
      display: block;
      font-size: 22px;
    }

    .media-stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .media-toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .media-search {
      flex: 1;
      min-width: 200px;
    }

    .media-filters {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .media-filter {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .media-filter.active {
      background: #7c5cff;
      color: white;
      border-color: #7c5cff;
    }

    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      background: var(--card);
      margin-bottom: 18px;
      transition: .2s;
    }

    .upload-box:hover {
      border-color: #7c5cff;
      background: rgba(124,92,255,.03);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .upload-box h2 {
      margin: 0 0 7px;
      font-size: 18px;
    }

    .upload-box p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      margin: 0 auto 15px;
      max-width: 600px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .media-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      min-width: 0;
    }

    .media-preview {
      height: 170px;
      background: var(--bg);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .media-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-file-icon {
      font-size: 50px;
    }

    .media-type-badge {
      position: absolute;
      top: 9px;
      right: 9px;
      padding: 4px 7px;
      border-radius: 7px;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 9px;
    }

    .media-info {
      padding: 12px;
    }

    .media-name {
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-meta {
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
    }

    .media-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .media-actions button {
      flex: 1;
      font-size: 11px;
    }

    .media-empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 65px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .media-empty-icon {
      font-size: 60px;
      margin-bottom: 12px;
    }

    .upload-progress {
      display: none;
      margin-top: 15px;
    }

    .upload-progress.show {
      display: block;
    }

    .upload-progress-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
    }

    .upload-progress-fill {
      height: 100%;
      width: 0;
      background: #7c5cff;
      transition: width .2s;
    }

    .upload-progress-text {
      color: var(--muted);
      font-size: 11px;
      margin-top: 6px;
    }

    @media(max-width:950px) {
      .media-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .media-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:650px) {
      .media-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .media-preview {
        height: 140px;
      }
    }

    @media(max-width:430px) {
      .media-grid {
        grid-template-columns: 1fr;
      }

      .media-stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="media-page">

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="topbar-title">
      <div>
        <strong>🖼️ رسانه‌ها</strong>
        <span>مدیریت فایل‌های پروژه</span>
      </div>
    </div>

    <div class="topbar-actions">

      <button
        class="btn"
        onclick="goBuilder()">
        ✏️ ویرایشگر
      </button>

      <button
        class="btn"
        onclick="goProjects()">
        📁 پروژه‌ها
      </button>

    </div>

  </header>


  <!-- HEADER -->

  <section class="media-header">

    <div class="media-title">

      <h1>
        کتابخانه رسانه
      </h1>

      <p>
        تصاویر، ویدیوها، صداها و فایل‌های موردنیاز پروژه‌ها
      </p>

    </div>

    <button
      class="btn btn-primary"
      onclick="openFilePicker()">
      ➕ افزودن فایل
    </button>

  </section>


  <main class="media-container">


    <!-- STATS -->

    <section class="media-stats">

      <div class="media-stat">

        <div class="media-stat-icon">
          📦
        </div>

        <strong id="totalCount">
          0
        </strong>

        <span>
          کل فایل‌ها
        </span>

      </div>


      <div class="media-stat">

        <div class="media-stat-icon">
          🖼️
        </div>

        <strong id="imageCount">
          0
        </strong>

        <span>
          تصاویر
        </span>

      </div>


      <div class="media-stat">

        <div class="media-stat-icon">
          🎬
        </div>

        <strong id="videoCount">
          0
        </strong>

        <span>
          ویدیوها
        </span>

      </div>


      <div class="media-stat">

        <div class="media-stat-icon">
          📄
        </div>

        <strong id="otherCount">
          0
        </strong>

        <span>
          سایر فایل‌ها
        </span>

      </div>

    </section>


    <!-- UPLOAD -->

    <section
      id="uploadBox"
      class="upload-box">

      <div class="upload-icon">
        ☁️
      </div>

      <h2>
        فایل خود را اضافه کنید
      </h2>

      <p>
        تصویر، ویدیو، صوت، JSON، TXT، SVG و فایل‌های
        پشتیبانی‌شده دیگر را انتخاب کنید.
      </p>

      <button
        class="btn btn-primary"
        onclick="openFilePicker()">
        📤 انتخاب فایل
      </button>

      <input
        id="fileInput"
        type="file"
        multiple
        hidden
        accept="
          image/*,
          video/*,
          audio/*,
          .json,
          .txt,
          .svg
        ">


      <div
        id="uploadProgress"
        class="upload-progress">

        <div class="upload-progress-bar">

          <div
            id="uploadProgressFill"
            class="upload-progress-fill">
          </div>

        </div>

        <div
          id="uploadProgressText"
          class="upload-progress-text">
          در حال آماده‌سازی...
        </div>

      </div>

    </section>


    <!-- TOOLBAR -->

    <section class="media-toolbar">

      <input
        id="searchInput"
        class="form-input media-search"
        placeholder="🔎 جستجوی فایل..."
        oninput="renderMedia()">


      <div class="media-filters">

        <button
          class="media-filter active"
          data-filter="all"
          onclick="setFilter('all',this)">
          همه
        </button>

        <button
          class="media-filter"
          data-filter="image"
          onclick="setFilter('image',this)">
          🖼️ تصاویر
        </button>

        <button
          class="media-filter"
          data-filter="video"
          onclick="setFilter('video',this)">
          🎬 ویدیو
        </button>

        <button
          class="media-filter"
          data-filter="audio"
          onclick="setFilter('audio',this)">
          🎵 صوت
        </button>

        <button
          class="media-filter"
          data-filter="other"
          onclick="setFilter('other',this)">
          📄 سایر
        </button>

      </div>

    </section>


    <!-- GRID -->

    <section
      id="mediaGrid"
      class="media-grid">
    </section>

  </main>

</div>


<script src="app.js"></script>

<script>

"use strict";


/* =====================================================
   STATE
   ===================================================== */

let currentFilter = "all";


/* =====================================================
   FILE PICKER
   ===================================================== */

function openFilePicker() {

  document
    .getElementById("fileInput")
    .click();

}


/* =====================================================
   FILE TYPE
   ===================================================== */

function getMediaType(file) {

  if (
    file.type &&
    file.type.startsWith("image/")
  ) {
    return "image";
  }

  if (
    file.type &&
    file.type.startsWith("video/")
  ) {
    return "video";
  }

  if (
    file.type &&
    file.type.startsWith("audio/")
  ) {
    return "audio";
  }

  const name =
    file.name.toLowerCase();


  if (
    name.endsWith(".jpg") ||
    name.endsWith(".jpeg") ||
    name.endsWith(".png") ||
    name.endsWith(".gif") ||
    name.endsWith(".webp") ||
    name.endsWith(".svg")
  ) {
    return "image";
  }


  if (
    name.endsWith(".mp4") ||
    name.endsWith(".webm") ||
    name.endsWith(".mov")
  ) {
    return "video";
  }


  if (
    name.endsWith(".mp3") ||
    name.endsWith(".wav") ||
    name.endsWith(".ogg")
  ) {
    return "audio";
  }


  return "other";

}


/* =====================================================
   FILE UPLOAD
   ===================================================== */

async function handleFiles(
  files
) {

  if (!files || !files.length) {
    return;
  }


  const progress =
    document.getElementById(
      "uploadProgress"
    );

  const fill =
    document.getElementById(
      "uploadProgressFill"
    );

  const text =
    document.getElementById(
      "uploadProgressText"
    );


  progress.classList.add(
    "show"
  );


  let completed = 0;


  for (
    const file of files
  ) {

    try {

      text.textContent =
        "در حال افزودن: " +
        file.name;


      fill.style.width =
        Math.round(
          (completed /
            files.length) *
            100
        ) + "%";


      /*
       * برای تصاویر، Data URL ذخیره می‌شود
       * تا امکان پیش‌نمایش داشته باشند.
       *
       * فایل‌های خیلی بزرگ ممکن است توسط
       * localStorage محدود شوند.
       */

      let dataUrl = "";


      if (
        file.type.startsWith(
          "image/"
        ) &&
        file.size <=
          3 * 1024 * 1024
      ) {

        dataUrl =
          await fileToDataURL(
            file
          );

      }


      gbAddMedia({

        name:
          file.name,

        type:
          getMediaType(
            file
          ),

        mime:
          file.type ||
          "application/octet-stream",

        size:
          file.size,

        sizeText:
          formatBytes(
            file.size
          ),

        dataUrl:
          dataUrl,

        createdAt:
          new Date().toISOString()

      });


      completed++;

    } catch (error) {

      console.error(
        error
      );

    }

  }


  fill.style.width =
    "100%";


  text.textContent =
    completed +
    " فایل با موفقیت اضافه شد.";


  renderMedia();


  setTimeout(
    () => {

      progress.classList.remove(
        "show"
      );

    },
    1200
  );


  gbToast(
    completed +
    " فایل اضافه شد.",
    "success"
  );

}


/* =====================================================
   DATA URL
   ===================================================== */

function fileToDataURL(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(
          reader.result
        );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
   BYTES
   ===================================================== */

function formatBytes(
  bytes
) {

  if (!bytes) {
    return "0 B";
  }


  const units =
    [
      "B",
      "KB",
      "MB",
      "GB"
    ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    Math.round(
      bytes /
      Math.pow(
        1024,
        index
      ) *
      100
    ) / 100
  ) +
  " " +
  units[
    Math.min(
      index,
      units.length - 1
    )
  ];

}


/* =====================================================
   FILTER
   ===================================================== */

function setFilter(
  filter,
  button
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".media-filter"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }


  renderMedia();

}


/* =====================================================
   RENDER
   ===================================================== */

function renderMedia() {

  const grid =
    document.getElementById(
      "mediaGrid"
    );


  let media =
    gbGetMedia();


  const search =
    (
      document.getElementById(
        "searchInput"
      ).value ||
      ""
    )
      .trim()
      .toLowerCase();


  if (
    currentFilter !==
    "all"
  ) {

    media =
      media.filter(
        item =>
          item.type ===
          currentFilter
      );

  }


  if (search) {

    media =
      media.filter(
        item =>
          (
            item.name ||
            ""
          )
            .toLowerCase()
            .includes(
              search
            )
      );

  }


  updateStats();


  if (!media.length) {

    grid.innerHTML = `

      <div class="media-empty">

        <div class="media-empty-icon">
          📂
        </div>

        <h2>
          فایلی پیدا نشد
        </h2>

        <p
          style="
            color:var(--muted);
            line-height:1.8;
          ">

          هنوز فایلی در این بخش وجود ندارد
          یا نتیجه‌ای مطابق جستجوی شما پیدا نشد.

        </p>

        <button
          class="btn btn-primary"
          onclick="openFilePicker()">

          ➕ افزودن فایل

        </button>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    media
      .map(
        item =>
          createMediaCard(
            item
          )
      )
      .join("");

}


/* =====================================================
   MEDIA CARD
   ===================================================== */

function createMediaCard(
  item
) {

  const type =
    item.type ||
    "other";


  let preview = "";


  if (
    type === "image" &&
    item.dataUrl
  ) {

    preview = `

      <img
        src="${item.dataUrl}"
        alt="${gbEscapeHTML(
          item.name
        )}">

      <div class="media-type-badge">
        IMAGE
      </div>

    `;

  } else {

    let icon =
      "📄";


    if (type === "video") {
      icon = "🎬";
    }

    if (type === "audio") {
      icon = "🎵";
    }

    if (type === "image") {
      icon = "🖼️";
    }


    preview = `

      <div class="media-file-icon">
        ${icon}
      </div>

      <div class="media-type-badge">
        ${type.toUpperCase()}
      </div>

    `;

  }


  return `

    <article class="media-item">

      <div class="media-preview">
        ${preview}
      </div>

      <div class="media-info">

        <div
          class="media-name"
          title="${gbEscapeHTML(
            item.name
          )}">

          ${gbEscapeHTML(
            item.name
          )}

        </div>

        <div class="media-meta">

          ${gbEscapeHTML(
            item.sizeText ||
            formatBytes(
              item.size || 0
            )
          )}

          •

          ${gbEscapeHTML(
            type
          )}

        </div>


        <div class="media-actions">

          ${
            type === "image" &&
            item.dataUrl
              ? `
                <button
                  class="btn"
                  onclick="useMedia('${item.id}')">
                  استفاده
                </button>
              `
              : ""
          }


          <button
            class="btn"
            onclick="copyMediaInfo('${item.id}')">
            📋
          </button>


          <button
            class="btn"
            onclick="deleteMediaItem('${item.id}')">
            🗑️
          </button>

        </div>

      </div>

    </article>

  `;

}


/* =====================================================
   STATS
   ===================================================== */

function updateStats() {

  const media =
    gbGetMedia();


  const images =
    media.filter(
      item =>
        item.type ===
        "image"
    ).length;


  const videos =
    media.filter(
      item =>
        item.type ===
        "video"
    ).length;


  const others =
    media.filter(
      item =>
        item.type !==
          "image" &&
        item.type !==
          "video"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    media.length;


  document.getElementById(
    "imageCount"
  ).textContent =
    images;


  document.getElementById(
    "videoCount"
  ).textContent =
    videos;


  document.getElementById(
    "otherCount"
  ).textContent =
    others;

}


/* =====================================================
   USE MEDIA
   ===================================================== */

function useMedia(
  id
) {

  const media =
    gbGetMedia();


  const item =
    media.find(
      file =>
        file.id ===
        id
    );


  if (!item) {
    return;
  }


  gbSet(
    GB_KEYS.selectedMedia,
    item
  );


  gbToast(
    "فایل انتخاب شد.",
    "success"
  );


  /*
   * اگر از builder آمده باشیم،
   * بعد از انتخاب فایل می‌توانیم
   * به builder برگردیم.
   */

  const from =
    gbParam("from");


  if (
    from ===
    "builder"
  ) {

    setTimeout(
      () => {

        window.location.href =
          "builder.html";

      },
      500
    );

  }

}


/* =====================================================
   COPY INFO
   ===================================================== */

function copyMediaInfo(
  id
) {

  const media =
    gbGetMedia();


  const item =
    media.find(
      file =>
        file.id ===
        id
    );


  if (!item) {
    return;
  }


  const text =
    [
      "نام: " +
        item.name,

      "نوع: " +
        item.type,

      "حجم: " +
        (
          item.sizeText ||
          formatBytes(
            item.size || 0
          )
        )

    ].join(
      "\n"
    );


  gbCopy(
    text
  );


  gbToast(
    "اطلاعات فایل کپی شد.",
    "success"
  );

}


/* =====================================================
   DELETE
   ===================================================== */

function deleteMediaItem(
  id
) {

  const media =
    gbGetMedia();


  const item =
    media.find(
      file =>
        file.id ===
        id
    );


  if (!item) {
    return;
  }


  if (
    !confirm(
      "آیا از حذف فایل «" +
      item.name +
      "» مطمئن هستید؟"
    )
  ) {

    return;

  }


  gbDeleteMedia(
    id
  );


  renderMedia();


  gbToast(
    "فایل حذف شد.",
    "success"
  );

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function goBuilder() {

  const project =
    gbGetCurrentProject();


  if (project) {

    window.location.href =
      "builder.html?project=" +
      encodeURIComponent(
        project.id
      );

    return;

  }


  window.location.href =
    "builder.html";

}


function goProjects() {

  window.location.href =
    "projects.html";

}


/* =====================================================
   FILE INPUT EVENT
   ===================================================== */

document
  .getElementById(
    "fileInput"
  )
  .addEventListener(
    "change",
    event => {

      handleFiles(
        event.target.files
      );

      event.target.value = "";

    }
  );


/* =====================================================
   DRAG & DROP
   ===================================================== */

const uploadBox =
  document.getElementById(
    "uploadBox"
  );


uploadBox.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    uploadBox.style.borderColor =
      "#7c5cff";

  }
);


uploadBox.addEventListener(
  "dragleave",
  () => {

    uploadBox.style.borderColor =
      "";

  }
);


uploadBox.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    uploadBox.style.borderColor =
      "";


    handleFiles(
      event.dataTransfer.files
    );

  }
);


/* =====================================================
   INIT
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    renderMedia();

  }
);

</script>
