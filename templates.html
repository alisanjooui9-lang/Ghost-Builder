<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghost Builder — قالب‌ها</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#080b12;
 --panel:#101521;
 --panel2:#151b29;
 --border:#252d3d;
 --text:#f4f7ff;
 --muted:#8e99ad;
 --primary:#7c5cff;
 --cyan:#22d3ee;
 --green:#22c55e;
}

body{
 font-family:Tahoma,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

button,input,select{font-family:inherit}
button{cursor:pointer}

.topbar{
 height:64px;
 background:#0d111b;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:20;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:900;
}

.logo{
 width:38px;
 height:38px;
 border-radius:11px;
 background:linear-gradient(135deg,#7c5cff,#22d3ee);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
}

.top-actions{
 display:flex;
 gap:8px;
}

.btn{
 border:1px solid var(--border);
 background:var(--panel);
 color:white;
 padding:10px 14px;
 border-radius:9px;
}

.btn.primary{
 background:var(--primary);
 border-color:var(--primary);
}

.container{
 max-width:1350px;
 margin:auto;
 padding:28px 20px 60px;
}

.hero{
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 gap:20px;
 margin-bottom:25px;
}

.hero h1{
 font-size:28px;
 margin-bottom:9px;
}

.hero p{
 color:var(--muted);
 font-size:13px;
 line-height:1.8;
}

.search{
 width:330px;
 background:var(--panel);
 border:1px solid var(--border);
 color:white;
 padding:13px;
 border-radius:10px;
 outline:none;
}

.search:focus{
 border-color:var(--primary);
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:8px;
 margin-bottom:25px;
}

.filter{
 white-space:nowrap;
 border:1px solid var(--border);
 background:var(--panel);
 color:#b9c2d2;
 padding:10px 15px;
 border-radius:9px;
}

.filter.active{
 background:var(--primary);
 border-color:var(--primary);
 color:white;
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:14px;
}

.section-title h2{
 font-size:17px;
}

.section-title span{
 color:var(--muted);
 font-size:11px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
}

.card{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:15px;
 overflow:hidden;
 transition:.2s;
}

.card:hover{
 transform:translateY(-4px);
 border-color:#46516a;
}

.preview{
 height:165px;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
}

.preview .emoji{
 font-size:52px;
 position:relative;
 z-index:2;
}

.preview::after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(135deg,rgba(124,92,255,.35),transparent);
}

.web{background:linear-gradient(135deg,#111827,#312e81)}
.shop{background:linear-gradient(135deg,#172554,#064e3b)}
.academy{background:linear-gradient(135deg,#172554,#1e1b4b)}
.ai{background:linear-gradient(135deg,#111827,#164e63)}
.creator{background:linear-gradient(135deg,#3b0764,#172554)}
.restaurant{background:linear-gradient(135deg,#431407,#3f1d0b)}
.blog{background:linear-gradient(135deg,#1f2937,#111827)}
.portfolio{background:linear-gradient(135deg,#0f172a,#334155)}
.app{background:linear-gradient(135deg,#1e1b4b,#312e81)}
.finance{background:linear-gradient(135deg,#052e16,#14532d)}
.health{background:linear-gradient(135deg,#083344,#164e63)}
.social{background:linear-gradient(135deg,#4a044e,#701a75)}
.game2d{background:linear-gradient(135deg,#172554,#7c2d12)}
.game3d{background:linear-gradient(135deg,#020617,#312e81)}
.racing{background:linear-gradient(135deg,#450a0a,#171717)}
.shooter{background:linear-gradient(135deg,#111827,#1e293b)}
.survival{background:linear-gradient(135deg,#052e16,#172554)}
.puzzle{background:linear-gradient(135deg,#3b0764,#172554)}
.sports{background:linear-gradient(135deg,#172554,#064e3b)}

.badge{
 position:absolute;
 top:10px;
 right:10px;
 z-index:3;
 background:rgba(0,0,0,.55);
 border:1px solid rgba(255,255,255,.12);
 color:white;
 padding:5px 8px;
 border-radius:6px;
 font-size:9px;
}

.info{
 padding:14px;
}

.name{
 font-weight:900;
 font-size:14px;
 margin-bottom:7px;
}

.description{
 color:var(--muted);
 font-size:10px;
 line-height:1.7;
 min-height:34px;
}

.tags{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin:11px 0;
}

.tag{
 background:#191f2c;
 color:#aeb8c9;
 border-radius:5px;
 padding:4px 6px;
 font-size:9px;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
}

.actions button{
 border:1px solid var(--border);
 background:#171e2b;
 color:white;
 padding:8px;
 border-radius:7px;
 font-size:10px;
}

.actions .use{
 background:var(--primary);
 border-color:var(--primary);
}

.empty{
 text-align:center;
 border:1px dashed #30394c;
 padding:65px 20px;
 border-radius:15px;
 display:none;
}

.empty.show{display:block}

.empty-icon{
 font-size:50px;
 margin-bottom:12px;
}

.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%) translateY(20px);
 opacity:0;
 background:#171e2b;
 border:1px solid #303a4d;
 padding:11px 17px;
 border-radius:9px;
 transition:.25s;
 z-index:100;
 font-size:12px;
 pointer-events:none;
}

.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

@media(max-width:1050px){
 .grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:750px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .hero{flex-direction:column;align-items:stretch}
 .search{width:100%}
}

@media(max-width:500px){
 .grid{grid-template-columns:1fr}
 .container{padding:20px 12px}
 .topbar{padding:0 10px}
}
</style>
</head>

<body>

<header class="topbar">

 <div class="brand">
  <div class="logo">G</div>
  <span>Ghost Builder</span>
 </div>

 <div class="top-actions">
  <button class="btn" onclick="goHome()">⌂ خانه</button>
  <button class="btn primary" onclick="newProject()">＋ پروژه جدید</button>
 </div>

</header>


<main class="container">

 <section class="hero">

  <div>
   <h1>🎨 کتابخانه قالب‌ها</h1>
   <p>
    قالب آماده انتخاب کن، وارد Builder شو و همه‌چیز را شخصی‌سازی کن.
   </p>
  </div>

  <input
   class="search"
   id="search"
   placeholder="🔎 جستجوی قالب..."
   oninput="render()"
  >

 </section>


 <div class="filters">

  <button class="filter active" onclick="setFilter('all',this)">همه</button>
  <button class="filter" onclick="setFilter('website',this)">🌐 وب‌سایت</button>
  <button class="filter" onclick="setFilter('shop',this)">🛒 فروشگاهی</button>
  <button class="filter" onclick="setFilter('academy',this)">🎓 آموزشی</button>
  <button class="filter" onclick="setFilter('ai',this)">🤖 هوش مصنوعی</button>
  <button class="filter" onclick="setFilter('app',this)">📱 اپلیکیشن</button>
  <button class="filter" onclick="setFilter('game2d',this)">🎮 بازی 2D</button>
  <button class="filter" onclick="setFilter('game3d',this)">🎮 بازی 3D</button>
  <button class="filter" onclick="setFilter('racing',this)">🏎️ مسابقه‌ای</button>
  <button class="filter" onclick="setFilter('shooter',this)">🔫 تیراندازی</button>
  <button class="filter" onclick="setFilter('puzzle',this)">🧩 پازل</button>

 </div>


 <div class="section-title">
  <h2>قالب‌های آماده</h2>
  <span id="count"></span>
 </div>


 <section class="grid" id="grid"></section>


 <div class="empty" id="empty">

  <div class="empty-icon">🔍</div>

  <h2>قالبی پیدا نشد</h2>

  <p style="color:var(--muted);margin-top:8px">
   نام یا دسته‌بندی دیگری را امتحان کن.
  </p>

 </div>

</main>


<div class="toast" id="toast"></div>


<script>

 },

 {

  description:"ماجراجویی سه‌بعدی در محیط فضایی.",
  tags:["3D","Adventure","Space"]
 },

 {

  name:"Battle Arena",
  type:"game3d",
  category:"shooter",
  icon:"🎯",
  className:"shooter",
  description:"محیط مبارزه سه‌بعدی با سیستم امتیاز.",
  tags:["3D","Battle","Arena"]
 }

];


let currentFilter="all";


/* =========================
   RENDER
========================= */

function render(){

 const search =
  document.getElementById("search")
  .value
  .trim()
  .toLowerCase();

 const list =
  templates.filter(item=>{

   const filterOK =
    currentFilter==="all" ||
    item.category===currentFilter;

   const searchOK =
    !search ||
    item.name.toLowerCase().includes(search) ||
    item.description.toLowerCase().includes(search) ||
    item.tags.join(" ").toLowerCase().includes(search);

   return filterOK && searchOK;

  });


 document.getElementById("count").textContent =
  list.length+" قالب";


 document.getElementById("grid").innerHTML =
  list.map(createCard).join("");


 document.getElementById("empty")
  .classList.toggle("show",list.length===0);

}


/* =========================
   CARD
========================= */

function createCard(item){

 return `

 <article class="card">

  <div class="preview ${item.className}">

   <span class="badge">
    ${typeName(item.type)}
   </span>

   <span class="emoji">
    ${item.icon}
   </span>

  </div>

  <div class="info">

   <div class="name">
    ${item.name}
   </div>

   <div class="description">
    ${item.description}
   </div>

   <div class="tags">

    ${item.tags.map(tag=>`
     <span class="tag">${tag}</span>
    `).join("")}

   </div>

   <div class="actions">

    <button onclick="previewTemplate('${item.id}')">
     👁️ پیش‌نمایش
    </button>

    <button class="use" onclick="useTemplate('${item.id}')">
     🚀 استفاده
    </button>

   </div>

  </div>

 </article>

 `;

}


/* =========================
   TYPE NAME
========================= */

function typeName(type){

 if(type==="website")return"وب‌سایت";
 if(type==="app")return"اپلیکیشن";
 if(type==="game2d")return"بازی 2D";
 if(type==="game3d")return"بازی 3D";

 return type;

}


/* =========================
   FILTER
========================= */

function setFilter(filter,button){

 currentFilter=filter;

 document
  .querySelectorAll(".filter")
  .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 render();

}


/* =========================
   USE TEMPLATE
========================= */

function useTemplate(id){

 const template =
  templates.find(x=>x.id===id);

 if(!template)return;


 let type="website";

 if(template.type==="app"){
  type="app";
 }

 if(template.type==="game2d"){
  type="game2d";
 }

 if(template.type==="game3d"){
  type="game3d";
 }


 const project={

  id:Date.now(),

  name:template.name,

  type:type,

  title:template.name,

  description:template.description,

  button:"شروع کنید",

  background:"#ffffff",

  primary:"#7c5cff",

  radius:18,

  width:
   type==="website" ? 900 : 390,

  height:
   type==="website" ? 650 : 700,

  quality:"High",

  resolution:"1080p",

  template:template.id,

  elements:[]

 };


 let projects=[];

 try{
  projects=
   JSON.parse(
    localStorage.getItem("ghost_builder_projects")
   ) || [];
 }catch(e){
  projects=[];
 }


 projects.push(project);


 localStorage.setItem(
  "ghost_builder_projects",
  JSON.stringify(projects)
 );


 localStorage.setItem(
  "ghost_builder_current_project",
  JSON.stringify(project)
 );


 showToast("قالب انتخاب شد ✓");


 setTimeout(()=>{

  location.href=
   "builder.html?type="+
   encodeURIComponent(type)+
   "&template="+
   encodeURIComponent(template.id);

 },500);

}


/* =========================
   PREVIEW
========================= */

function previewTemplate(id){

 const template =
  templates.find(x=>x.id===id);

 if(!template)return;

 localStorage.setItem(
  "ghost_builder_preview_template",
  JSON.stringify(template)
 );

 location.href=
  "preview.html?template="+
  encodeURIComponent(id);

}


/* =========================
   NEW PROJECT
========================= */

function newProject(){

 const project={

  id:Date.now(),

  name:"پروژه جدید",

  type:"website",

  title:"پروژه جدید",

  description:
   "پروژه خود را با Ghost Builder بسازید.",

  button:"شروع کنید",

  background:"#ffffff",

  primary:"#7c5cff",

  radius:18,

  width:900,

  height:650,

  quality:"Medium",

  resolution:"720p",

  elements:[]

 };


 localStorage.setItem(
  "ghost_builder_current_project",
  JSON.stringify(project)
 );


 location.href=
  "builder.html?type=website";

}


/* =========================
   HOME
========================= */

function goHome(){

 location.href="index.html";

}


/* =========================
   TOAST
========================= */

function showToast(message){

 const toast=
  document.getElementById("toast");

 toast.textContent=message;

 toast.classList.add("show");

 setTimeout(()=>{
  toast.classList.remove("show");
 },2200);

}


/* =========================
   START
========================= */

render();

</script>

</body>
