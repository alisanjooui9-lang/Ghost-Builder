<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ghost Builder — پیش‌نمایش</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       PREVIEW PAGE
       ===================================================== */

    body {
      overflow-x: hidden;
    }

    .preview-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .preview-topbar {
      min-height: 70px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .preview-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .preview-brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(
        135deg,
        #7c5cff,
        #4f46e5
      );
      color: white;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 8px 25px rgba(124,92,255,.25);
      flex-shrink: 0;
    }

    .preview-brand-text {
      min-width: 0;
    }

    .preview-brand-text strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-brand-text span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .preview-workspace {
      flex: 1;
      min-height: calc(100vh - 70px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .preview-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .preview-info-title {
      font-size: 19px;
      font-weight: 900;
    }

    .preview-info-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .preview-stage {
      flex: 1;
      min-height: 650px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        radial-gradient(
          circle at top,
          rgba(124,92,255,.08),
          transparent 40%
        ),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 35px;
      position: relative;
    }

    .preview-device {
      width: 390px;
      min-height: 700px;
      background: white;
      border-radius: 26px;
      box-shadow:
        0 25px 70px rgba(0,0,0,.20);
      overflow: hidden;
      transition: .25s ease;
      position: relative;
      flex-shrink: 0;
    }

    .preview-device.tablet {
      width: 768px;
      min-height: 720px;
      border-radius: 22px;
    }

    .preview-device.desktop {
      width: min(1100px, 100%);
      min-height: 650px;
      border-radius: 16px;
    }

    .preview-canvas {
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .preview-mobile-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.04);
      position: relative;
    }

    .preview-mobile-camera {
      width: 55px;
      height: 6px;
      border-radius: 20px;
      background: rgba(0,0,0,.20);
    }

    .preview-content {
      padding: 25px;
    }

    .preview-hero {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .preview-hero-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .preview-hero h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .preview-hero p {
      margin: 0 0 20px;
      line-height: 1.9;
      opacity: .72;
      max-width: 650px;
    }

    .preview-primary-button {
      border: 0;
      color: white;
      padding: 12px 23px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }

    .preview-elements {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
    }

    .preview-element {
      width: 100%;
      box-sizing: border-box;
    }

    .preview-card {
      padding: 18px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .preview-card h3 {
      margin: 0;
      font-size: 17px;
    }

    .preview-card p {
      margin: 8px 0 0;
      line-height: 1.8;
      color: #666;
      font-size: 13px;
    }

    .preview-input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      background: white;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    .preview-section {
      width: 100%;
      min-height: 150px;
      box-sizing: border-box;
    }

    .game-preview {
      min-height: 100%;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(124,92,255,.20),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #070912,
          #12152a
        );
      color: white;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .game-hud-box {
      padding: 8px 11px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 10px;
      font-size: 11px;
    }

    .game-world {
      min-height: 520px;
      margin-top: 20px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          #151a36 0%,
          #0a0d19 65%,
          #080a10 100%
        );
      border: 1px solid rgba(255,255,255,.10);
    }

    .game-grid {
      position: absolute;
      inset: 45% -30% -30%;
      background:
        linear-gradient(
          90deg,
          rgba(124,92,255,.20) 1px,
          transparent 1px
        ),
        linear-gradient(
          rgba(124,92,255,.20) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      transform: perspective(300px) rotateX(58deg);
      transform-origin: center top;
    }

    .game-player {
      position: absolute;
      left: 50%;
      bottom: 23%;
      transform: translateX(-50%);
      font-size: 55px;
      z-index: 2;
      filter: drop-shadow(
        0 12px 20px rgba(0,0,0,.45)
      );
    }

    .game-target {
      position: absolute;
      top: 27%;
      left: 68%;
      font-size: 35px;
      animation: targetFloat 2.2s infinite ease-in-out;
    }

    @keyframes targetFloat {
      0%,100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    .game-crosshair {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 35px;
      height: 35px;
      transform: translate(-50%,-50%);
      border: 2px solid rgba(255,255,255,.75);
      border-radius: 50%;
      z-index: 3;
    }

    .game-crosshair::after,
    .game-crosshair::before {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.75);
    }

    .game-crosshair::after {
      width: 55px;
      height: 2px;
      left: -12px;
      top: 15px;
    }

    .game-crosshair::before {
      height: 55px;
      width: 2px;
      top: -12px;
      left: 15px;
    }

    .game-controls {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 5;
    }

    .joystick {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      display: grid;
      place-items: center;
    }

    .joystick::after {
      content: "";
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
    }

    .game-buttons {
      display: flex;
      gap: 8px;
    }

    .game-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 18px;
    }

    .preview-empty {
      min-height: 450px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .preview-empty-icon {
      font-size: 60px;
      margin-bottom: 12px;
    }

    .preview-url-box {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .preview-url-box input {
      flex: 1;
      min-width: 0;
    }

    .preview-footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 5px;
    }

    @media (max-width: 800px) {

      .preview-topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .preview-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .preview-workspace {
        padding: 10px;
      }

      .preview-stage {
        padding: 15px;
        min-height: 600px;
        border-radius: 18px;
      }

      .preview-device.desktop {
        width: 100%;
      }

      .preview-device.tablet {
        width: min(768px, 100%);
      }

      .preview-info {
        align-items: flex-start;
        flex-direction: column;
      }

      .preview-url-box {
        flex-direction: column;
      }

    }

  </style>
</head>

<body>

<div class="preview-page">

  <!-- =====================================================
       TOPBAR
       ===================================================== -->

  <header class="preview-topbar">

    <div class="preview-brand">

      <div class="preview-brand-logo">
        G
      </div>

      <div class="preview-brand-text">

        <strong id="projectName">
          پیش‌نمایش پروژه
        </strong>

        <span>
          Ghost Builder Preview
        </span>

      </div>

    </div>


    <div class="preview-actions">

      <button
        class="btn"
        onclick="goBack()">
        ← بازگشت
      </button>

      <button
        class="btn"
        onclick="editProject()">
        ✏️ ویرایش
      </button>

      <button
        class="btn"
        onclick="setDeviceMode('mobile')">
        📱
      </button>

      <button
        class="btn"
        onclick="setDeviceMode('tablet')">
        ▣
      </button>

      <button
        class="btn"
        onclick="setDeviceMode('desktop')">
        🖥️
      </button>

      <button
        class="btn btn-primary"
        onclick="publishProject()">
        🚀 انتشار
      </button>

    </div>

  </header>


  <!-- =====================================================
       WORKSPACE
       ===================================================== -->

  <main class="preview-workspace">


    <!-- INFO -->

    <div class="preview-info">

      <div>

        <div
          id="previewTitle"
          class="preview-info-title">
          پروژه
        </div>

        <div
          id="previewMeta"
          class="preview-info-meta">
        </div>

      </div>


      <div
        id="previewUrlContainer"
        style="min-width:min(100%,420px);">
      </div>

    </div>


    <!-- STAGE -->

    <section class="preview-stage">

      <div
        id="previewDevice"
        class="preview-device mobile">

        <div
          id="previewCanvas"
          class="preview-canvas">
        </div>

      </div>

    </section>


    <div class="preview-footer">
      ساخته‌شده با Ghost Builder
    </div>

  </main>

</div>


<script src="app.js"></script>

<script>

"use strict";


/* =====================================================
   STATE
   ===================================================== */

let project = null;

let templateId = null;


/* =====================================================
   GET PROJECT
   ===================================================== */

function getProject() {

  const id =
    gbParam("project");


  if (id) {

    const found =
      gbFindProject(id);


    if (found) {

      return found;

    }

  }


  const current =
    gbGetCurrentProject();


  if (current) {

    return current;

  }


  return null;

}


/* =====================================================
   GET TEMPLATE
   ===================================================== */

function getTemplateId() {

  return (
    gbParam("template") ||
    localStorage.getItem(
      "ghost_builder_preview_template"
    ) ||
    sessionStorage.getItem(
      "ghost_builder_preview_template"
    )
  );

}


/* =====================================================
   INIT
   ===================================================== */

function initPreview() {

  templateId =
    getTemplateId();


  project =
    getProject();


  if (!project) {

    renderEmpty();

    return;

  }


  gbSetCurrentProject(
    project
  );


  updateInfo();

  renderProject();

}


/* =====================================================
   UPDATE INFO
   ===================================================== */

function updateInfo() {

  const name =
    project.name ||
    project.title ||
    "پروژه جدید";


  document.getElementById(
    "projectName"
  ).textContent =
    name;


  document.getElementById(
    "previewTitle"
  ).textContent =
    name;


  const type =
    gbProjectTypeLabel(
      project.type
    );


  document.getElementById(
    "previewMeta"
  ).innerHTML = `

    <span class="badge">
      ${gbProjectTypeIcon(
        project.type
      )}
      ${type}
    </span>

    <span class="badge">
      🎨 ${
        gbEscapeHTML(
          project.quality ||
          "Medium"
        )
      }
    </span>

    <span class="badge">
      📺 ${
        gbEscapeHTML(
          project.resolution ||
          "720p"
        )
      }
    </span>

  `;


  const url =
    window.location.origin +
    window.location.pathname +
    "?project=" +
    encodeURIComponent(
      project.id
    );


  document.getElementById(
    "previewUrlContainer"
  ).innerHTML = `

    <div class="preview-url-box">

      <input
        class="form-input"
        id="projectUrl"
        value="${gbEscapeHTML(
          url
        )}"
        readonly
      >

      <button
        class="btn"
        onclick="copyPreviewUrl()">
        📋 کپی
      </button>

    </div>

  `;

}


/* =====================================================
   RENDER PROJECT
   ===================================================== */

function renderProject() {

  if (
    project.type ===
    "game2d" ||
    project.type ===
    "game3d"
  ) {

    renderGame();

    return;

  }


  renderWebsite();

}


/* =====================================================
   RENDER WEBSITE / APP
   ===================================================== */

function renderWebsite() {

  const canvas =
    document.getElementById(
      "previewCanvas"
    );


  canvas.innerHTML = "";


  canvas.style.background =
    project.background ||
    "#ffffff";


  canvas.style.color =
    project.background ===
    "#ffffff"
      ? "#111111"
      : "#ffffff";


  const radius =
    project.radius ??
    18;


  const icon =
    gbProjectTypeIcon(
      project.type
    );


  /* HERO */

  const hero =
    document.createElement(
      "section"
    );


  hero.className =
    "preview-hero";


  hero.innerHTML = `

    <div class="preview-hero-icon">
      ${icon}
    </div>

    <h1>
      ${gbEscapeHTML(
        project.title ||
        project.name ||
        "پروژه جدید"
      )}
    </h1>

    <p>
      ${gbEscapeHTML(
        project.description ||
        "پروژه ساخته‌شده با Ghost Builder."
      )}
    </p>

    <button
      class="preview-primary-button"
      style="
        background:${
          project.primary ||
          "#7c5cff"
        };

        border-radius:
        ${radius}px;
      "
      onclick="demoButton()">
      ${gbEscapeHTML(
        project.button ||
        "شروع کنید"
      )}
    </button>

  `;


  canvas.appendChild(
    hero
  );


  /* ELEMENTS */

  const elements =
    project.elements ||
    [];


  if (
    elements.length
  ) {

    const elementsContainer =
      document.createElement(
        "div"
      );


    elementsContainer.className =
      "preview-elements";


    elements.forEach(
      element => {

        const rendered =
          renderElement(
            element
          );


        if (rendered) {

          elementsContainer.appendChild(
            rendered
          );

        }

      }
    );


    canvas.appendChild(
      elementsContainer
    );

  }


  /* FOOTER */

  const footer =
    document.createElement(
      "div"
    );


  footer.style.padding =
    "25px";

  footer.style.textAlign =
    "center";

  footer.style.opacity =
    ".55";

  footer.style.fontSize =
    "11px";

  footer.textContent =
    "ساخته‌شده با Ghost Builder";


  canvas.appendChild(
    footer
  );

}


/* =====================================================
   RENDER ELEMENT
   ===================================================== */

function renderElement(
  element
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "preview-element";


  if (
    element.type ===
    "text"
  ) {

    wrapper.innerHTML = `

      <div style="
        font-size:${
          Number(
            element.fontSize ||
            20
          )
        }px;

        color:${
          element.color ||
          "inherit"
        };

        font-weight:700;

        line-height:1.8;
      ">
        ${gbEscapeHTML(
          element.text ||
          "متن"
        )}
      </div>

    `;

    return wrapper;

  }


  if (
    element.type ===
    "button"
  ) {

    wrapper.innerHTML = `

      <button
        class="preview-primary-button"
        style="
          background:${
            element.color ||
            project.primary ||
            "#7c5cff"
          };

          border-radius:
          ${project.radius ?? 18}px;
        "
        onclick="demoButton()">

        ${gbEscapeHTML(
          element.text ||
          "دکمه"
        )}

      </button>

    `;

    return wrapper;

  }


  if (
    element.type ===
    "card"
  ) {

    wrapper.innerHTML = `

      <div
        class="preview-card"
        style="
          border-radius:
          ${project.radius ?? 18}px;
        ">

        <h3>
          ${gbEscapeHTML(
            element.title ||
            "کارت جدید"
          )}
        </h3>

        <p>
          ${gbEscapeHTML(
            element.description ||
            ""
          )}
        </p>

      </div>

    `;

    return wrapper;

  }


  if (
    element.type ===
    "image"
  ) {

    if (
      element.src
    ) {

      wrapper.innerHTML = `

        <img
          src="${gbEscapeHTML(
            element.src
          )}"
          alt="${gbEscapeHTML(
            element.alt ||
            "تصویر"
          )}"
          style="
            display:block;
            width:100%;
            max-height:320px;
            object-fit:cover;
            border-radius:
            ${project.radius ?? 18}px;
          "
        >

      `;

    } else {

      wrapper.innerHTML = `

        <div style="
          min-height:180px;
          display:grid;
          place-items:center;
          background:#eef0f5;
          color:#777;
          font-size:48px;
          border-radius:
          ${project.radius ?? 18}px;
        ">
          🖼️
        </div>

      `;

    }


    return wrapper;

  }


  if (
    element.type ===
    "input"
  ) {

    wrapper.innerHTML = `

      <input
        class="preview-input"
        type="text"
        placeholder="${gbEscapeHTML(
          element.placeholder ||
          "متن خود را وارد کنید..."
        )}"
        style="
          border-radius:
          ${project.radius ?? 18}px;
        "
      >

    `;

    return wrapper;

  }


  if (
    element.type ===
    "section"
  ) {

    wrapper.innerHTML = `

      <div
        class="preview-section"
        style="
          background:
          ${
            element.background ||
            "#f0f2f7"
          };

          border-radius:
          ${project.radius ?? 18}px;
        ">
      </div>

    `;

    return wrapper;

  }


  return null;

}


/* =====================================================
   GAME PREVIEW
   ===================================================== */

function renderGame() {

  const canvas =
    document.getElementById(
      "previewCanvas"
    );


  canvas.innerHTML = "";


  canvas.className =
    "preview-canvas game-preview";


  canvas.innerHTML = `

    <div class="game-hud">

      <div class="game-hud-box">
        ❤️ HP 100
      </div>

      <div class="game-hud-box">
        ⭐ SCORE 000
      </div>

      <div class="game-hud-box">
        🪙 000
      </div>

    </div>


    <div
      class="game-world"
      id="gameWorld">

      <div class="game-grid"></div>

      <div class="game-crosshair"></div>

      <div class="game-target">
        🎯
      </div>

      <div class="game-player">
        🧍
      </div>

      <div class="game-controls">

        <div class="joystick"></div>

        <div class="game-buttons">

          <button
            class="game-button"
            onclick="gameDemoAction('⚡')">
            ⚡
          </button>

          <button
            class="game-button"
            onclick="gameDemoAction('🛡️')">
            🛡️
          </button>

          <button
            class="game-button"
            onclick="gameDemoAction('🎯')">
            🎯
          </button>

        </div>

      </div>

    </div>


    <div
      style="
        text-align:center;
        padding:18px 10px;
        opacity:.75;
        font-size:12px;
      ">

      <strong>
        ${gbEscapeHTML(
          project.title ||
          project.name ||
          "Game"
        )}
      </strong>

      <br>

      ${gbEscapeHTML(
        project.description ||
        "پیش‌نمایش بازی"
      )}

    </div>

  `;

}


/* =====================================================
   EMPTY
   ===================================================== */

function renderEmpty() {

  const canvas =

/* =====================================================
   DEVICE MODE
   ===================================================== */

function setDeviceMode(
  mode
) {

  const device =
    document.getElementById(
      "previewDevice"
    );


  device.classList.remove(
    "mobile",
    "tablet",
    "desktop"
  );


  device.classList.add(
    mode
  );


  gbToast(
    mode === "mobile"
      ? "نمایش موبایل"
      : mode === "tablet"
        ? "نمایش تبلت"
        : "نمایش دسکتاپ",
    "success"
  );

}


/* =====================================================
   EDIT
   ===================================================== */

function editProject() {

  if (!project) {
    return;
  }


  gbSetCurrentProject(
    project
  );


  window.location.href =
    "builder.html?project=" +
    encodeURIComponent(
      project.id
    );

}


/* =====================================================
   PUBLISH
   ===================================================== */

function publishProject() {

  if (!project) {
    return;
  }


  gbSetCurrentProject(
    project
  );


  gbPublish(
    project.id,
    "web"
  );

}


/* =====================================================
   BACK
   ===================================================== */

function goBack() {

  if (project) {

    gbSetCurrentProject(
      project
    );

  }


  window.location.href =
    "projects.html";

}


/* =====================================================
   COPY URL
   ===================================================== */

function copyPreviewUrl() {

  const input =
    document.getElementById(
      "projectUrl"
    );


  if (!input) {
    return;
  }


  gbCopy(
    input.value
  );


  gbToast(
    "لینک پیش‌نمایش کپی شد.",
    "success"
  );

}


/* =====================================================
   DEMO BUTTON
   ===================================================== */

function demoButton() {

  gbToast(
    "این دکمه در حالت پیش‌نمایش آزمایشی است.",
    "success"
  );

}


/* =====================================================
   GAME ACTION
   ===================================================== */

function gameDemoAction(
  action
) {

  gbToast(
    action +
    " قابلیت بازی آزمایشی فعال شد.",

  );

}


/* =====================================================
   INIT
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    initPreview();

  }
