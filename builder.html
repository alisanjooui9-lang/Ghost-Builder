<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Builder — Builder</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080b12;
    --panel:#101521;
    --panel2:#151b29;
    --border:#252d3d;
    --text:#f4f7ff;
    --muted:#8e99ad;
    --primary:#7c5cff;
    --primary2:#5b3df5;
    --success:#22c55e;
    --danger:#ef4444;
    --cyan:#22d3ee;
    --orange:#f59e0b;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow:hidden;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:64px;
    background:#0d111b;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:fixed;
    top:0;
    right:0;
    left:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:900;
    font-size:19px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:11px;
    background:linear-gradient(135deg,#7c5cff,#22d3ee);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:900;
}

.project-name{
    color:#fff;
}

.project-name span{
    color:var(--muted);
    font-size:12px;
    display:block;
    margin-top:3px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.top-btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:white;
    padding:9px 13px;
    border-radius:9px;
    font-size:13px;
}

.top-btn:hover{
    border-color:var(--primary);
}

.preview-btn{
    background:#172033;
}

.build-btn{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    border:none;
}

/* =========================
   LAYOUT
========================= */

.workspace{
    display:flex;
    position:absolute;
    top:64px;
    bottom:0;
    right:0;
    left:0;
}

/* =========================
   LEFT TOOLBAR
========================= */

.tools{
    width:75px;
    background:#0d111a;
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px 7px;
    gap:8px;
    overflow-y:auto;
}

.tool{
    width:60px;
    min-height:60px;
    border:1px solid transparent;
    border-radius:12px;
    background:transparent;
    color:#aeb8ca;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:10px;
}

.tool .icon{
    font-size:21px;
}

.tool:hover,
.tool.active{
    background:#171d2b;
    border-color:#30394c;
    color:#fff;
}

.tool.active{
    box-shadow:inset 3px 0 0 var(--primary);
}

/* =========================
   CENTER CANVAS
========================= */

.canvas-area{
    flex:1;
    background:
        radial-gradient(circle at center,rgba(124,92,255,.08),transparent 35%),
        #080b12;
    position:relative;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:55px;
}

.grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:24px 24px;
    pointer-events:none;
}

.device{
    width:390px;
    min-height:700px;
    background:#fff;
    color:#111;
    border-radius:18px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 0 8px #151b26;
    position:relative;
    overflow:hidden;
    z-index:2;
    transition:.25s;
}

.device.web{
    width:900px;
    min-height:650px;
    border-radius:8px;
}

.device.app{
    width:390px;
    min-height:700px;
}

.device.game{
    width:900px;
    min-height:600px;
    background:#111;
    color:white;
}

.device-header{
    height:50px;
    background:#f4f4f4;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:7px;
}

.device-header .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ccc;
}

.preview-content{
    min-height:650px;
    padding:25px;
}

/* =========================
   RIGHT PANEL
========================= */

.properties{
    width:310px;
    background:#0d111a;
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:15px;
}

.panel-title{
    font-size:15px;
    font-weight:900;
    margin-bottom:14px;
}

.section{
    border:1px solid var(--border);
    background:#111722;
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
}

.section-title{
    padding:12px;
    border-bottom:1px solid var(--border);
    font-size:12px;
    font-weight:bold;
}

.section-body{
    padding:12px;
}

.field{
    margin-bottom:12px;
}

.field:last-child{
    margin-bottom:0;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    background:#090d15;
    border:1px solid #293245;
    color:white;
    border-radius:8px;
    padding:9px;
    outline:none;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--primary);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.color-input{
    width:100%;
    height:40px;
    padding:3px;
    border-radius:8px;
    background:#090d15;
    border:1px solid #293245;
}

/* =========================
   COMPONENTS
========================= */

.component{
    width:100%;
    padding:10px;
    border:1px solid #2a3345;
    background:#151b27;
    color:white;
    border-radius:8px;
    margin-bottom:7px;
    text-align:right;
}

.component:hover{
    border-color:var(--primary);
}

/* =========================
   PROJECT MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:550px;
    background:#111722;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modal-title{
    font-size:19px;
    font-weight:900;
    margin-bottom:8px;
}

.modal-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-bottom:18px;
}

.output-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.output{
    padding:18px;
    border:1px solid var(--border);
    background:#0c1119;
    border-radius:12px;
    color:white;
    text-align:center;
}

.output:hover{
    border-color:var(--primary);
    background:#141a28;
}

.output-icon{
    font-size:28px;
    margin-bottom:8px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modal-actions button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#181f2d;
    color:white;
}

.modal-actions .primary{
    background:var(--primary);
    border-color:var(--primary);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(30px);
    background:#151c2a;
    border:1px solid #303a4d;
    padding:12px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:900;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .properties{
        position:fixed;
        right:0;
        top:64px;
        bottom:0;
        width:290px;
        transform:translateX(100%);
        transition:.25s;
        z-index:200;
    }

    .properties.open{
        transform:translateX(0);
    }

    .tools{
        width:64px;
    }

    .tool{
        width:52px;
        min-height:55px;
    }

    .canvas-area{
        padding:30px;
    }

    .device.web,
    .device.game{
        width:700px;
    }

    .property-toggle{
        display:block !important;
    }
}

.property-toggle{
    display:none;
}

@media(max-width:550px){

    .project-name{
        display:none;
    }

    .topbar{
        padding:0 8px;
    }

    .top-btn{
        padding:8px;
        font-size:11px;
    }

    .tools{
        width:58px;
    }

    .tool{
        width:48px;
        min-height:52px;
    }

    .tool .icon{
        font-size:18px;
    }

    .canvas-area{
        padding:25px;
    }

    .device{
        transform-origin:top center;
    }
}
</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

    <div class="brand">
        <div class="logo">G</div>

        <div class="project-name">
            <span id="projectNameTop">پروژه جدید</span>
            <span id="projectTypeTop">Website Builder</span>
        </div>
    </div>

    <div class="top-actions">

        <button class="top-btn" onclick="goBack()">
            ← بازگشت
        </button>

        <button class="top-btn" onclick="saveProject()">
            💾 ذخیره
        </button>

        <button class="top-btn preview-btn" onclick="previewProject()">
            👁️ پیش‌نمایش
        </button>

        <button class="top-btn build-btn" onclick="openBuildModal()">
            🚀 ساخت
        </button>

    </div>

</header>


<div class="workspace">

    <!-- =========================
         TOOLS
    ========================= -->

    <aside class="tools">

        <button class="tool active" onclick="selectTool(this,'select')">
            <span class="icon">↖️</span>
            انتخاب
        </button>

        <button class="tool" onclick="selectTool(this,'text')">
            <span class="icon">T</span>
            متن
        </button>

        <button class="tool" onclick="selectTool(this,'button')">
            <span class="icon">🔘</span>
            دکمه
        </button>

        <button class="tool" onclick="selectTool(this,'image')">
            <span class="icon">🖼️</span>
            تصویر
        </button>

        <button class="tool" onclick="selectTool(this,'video')">
            <span class="icon">🎬</span>
            ویدیو
        </button>

        <button class="tool" onclick="selectTool(this,'card')">
            <span class="icon">▣</span>
            کارت
        </button>

        <button class="tool" onclick="selectTool(this,'input')">
            <span class="icon">⌨️</span>
            فرم
        </button>

        <button class="tool" onclick="selectTool(this,'menu')">
            <span class="icon">☰</span>
            منو
        </button>

        <button class="tool" onclick="selectTool(this,'game')">
            <span class="icon">🎮</span>
            بازی
        </button>

        <button class="tool" onclick="selectTool(this,'code')">
            <span class="icon">💻</span>
            کد
        </button>

        <button class="tool property-toggle" onclick="toggleProperties()">
            <span class="icon">⚙️</span>
            تنظیمات
        </button>

    </aside>


    <!-- =========================
         CANVAS
    ========================= -->

    <main class="canvas-area">

        <div class="grid"></div>

        <div class="device" id="device">

            <div class="device-header">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="preview-content" id="previewContent">

                <h1 id="heroTitle">
                    پروژه جدید
                </h1>

                <p id="heroText" style="margin-top:12px;color:#666;">
                    پروژه خود را با Ghost Builder بسازید.
                </p>

                <button
                    id="heroButton"
                    style="
                    margin-top:20px;
                    padding:12px 20px;
                    border:0;
                    border-radius:9px;
                    background:#7c5cff;
                    color:white;
                    ">
                    شروع کنید
                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         PROPERTIES
    ========================= -->

    <aside class="properties" id="properties">

        <div class="panel-title">
            ⚙️ تنظیمات پروژه
        </div>


        <div class="section">

            <div class="section-title">
                پروژه
            </div>

            <div class="section-body">

                <div class="field">
                    <label>نام پروژه</label>
                    <input
                        id="projectName"
                        type="text"
                        placeholder="نام پروژه"
                        oninput="changeProjectName(this.value)"
                    >
                </div>

                <div class="field">
                    <label>نوع پروژه</label>

                    <select id="projectType" onchange="changeProjectType(this.value)">
                        <option value="website">🌐 وب‌سایت</option>
                        <option value="app">📱 اپلیکیشن</option>
                        <option value="game2d">🎮 بازی 2D</option>
                        <option value="game3d">🎮 بازی 3D</option>
                    </select>

                </div>

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                🧩 افزودن اجزا
            </div>

            <div class="section-body">

                <button class="component" onclick="addElement('text')">
                    ➕ متن
                </button>

                <button class="component" onclick="addElement('button')">
                    ➕ دکمه
                </button>

                <button class="component" onclick="addElement('card')">
                    ➕ کارت
                </button>

                <button class="component" onclick="addElement('image')">
                    ➕ تصویر
                </button>

                <button class="component" onclick="addElement('input')">
                    ➕ فیلد ورود
                </button>

                <button class="component" onclick="addElement('section')">
                    ➕ بخش جدید
                </button>

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                🎨 ظاهر
            </div>

            <div class="section-body">

                <div class="field">
                    <label>رنگ پس‌زمینه</label>

                    <input
                        class="color-input"
                        id="bgColor"
                        type="color"
                        value="#ffffff"
                        onchange="changeBackground(this.value)"
                    >
                </div>

                <div class="field">
                    <label>رنگ اصلی</label>

                    <input
                        class="color-input"
                        id="primaryColor"
                        type="color"
                        value="#7c5cff"
                        onchange="changePrimary(this.value)"
                    >
                </div>

                <div class="field">
                    <label>اندازه گوشه‌ها</label>

                    <input
                        id="radius"
                        type="range"
                        min="0"
                        max="40"
                        value="18"
                        oninput="changeRadius(this.value)"
                    >

                </div>

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                📐 اندازه خروجی
            </div>

            <div class="section-body">

                <div class="row">

                    <div class="field">
                        <label>عرض</label>
                        <input
                            id="canvasWidth"
                            type="number"
                            value="390"
                            onchange="changeCanvasSize()"
                        >
                    </div>

                    <div class="field">
                        <label>ارتفاع</label>
                        <input
                            id="canvasHeight"
                            type="number"
                            value="700"
                            onchange="changeCanvasSize()"
                        >
                    </div>

                </div>

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                📝 محتوای اصلی
            </div>

            <div class="section-body">

                <div class="field">
                    <label>عنوان</label>

                    <input
                        id="titleInput"
                        value="پروژه جدید"
                        oninput="changeTitle(this.value)"
                    >
                </div>

                <div class="field">
                    <label>توضیحات</label>

                    <textarea
                        id="descriptionInput"
                        oninput="changeDescription(this.value)"
                    >پروژه خود را با Ghost Builder بسازید.</textarea>
                </div>

                <div class="field">
                    <label>متن دکمه</label>

                    <input
                        id="buttonInput"
                        value="شروع کنید"
                        oninput="changeButton(this.value)"
                    >
                </div>

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                🎮 امکانات
            </div>

            <div class="section-body">

                <div class="field">
                    <label>گرافیک</label>

                    <select id="quality">
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                        <option>Ultra</option>
                        <option>Custom</option>
                    </select>

                </div>

                <div class="field">
                    <label>رزولوشن</label>

                    <select id="resolution">
                        <option>480p</option>
                        <option selected>720p</option>
                        <option>1080p</option>
                        <option>1440p</option>
                        <option>2160p / 4K</option>
                    </select>

                </div>

            </div>

        </div>

    </aside>

</div>


<!-- =========================
     BUILD MODAL
========================= -->

<div class="modal" id="buildModal">

    <div class="modal-box">

        <div class="modal-title">
            🚀 ساخت پروژه
        </div>

        <div class="modal-subtitle">
            خروجی موردنظر خود را انتخاب کنید.
        </div>

        <div class="output-grid">

            <button class="output" onclick="buildWeb()">

                <div class="output-icon">🌐</div>

                <strong>خروجی Web</strong>

                <p style="font-size:11px;color:#8e99ad;margin-top:7px;">
                    دریافت لینک پروژه
                </p>

            </button>


            <button class="output" onclick="buildAPK()">

                <div class="output-icon">📱</div>

                <strong>دریافت APK</strong>

                <p style="font-size:11px;color:#8e99ad;margin-top:7px;">
                    تبدیل لینک پروژه به APK
                </p>

            </button>

        </div>


        <div class="modal-actions">

            <button onclick="closeBuildModal()">
                انصراف
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ==========================================
   PROJECT DATA
========================================== */

let project = {
    id: Date.now(),
    name: "پروژه جدید",
    type: "website",
    title: "پروژه جدید",
    description: "پروژه خود را با Ghost Builder بسازید.",
    button: "شروع کنید",
    background: "#ffffff",
    primary: "#7c5cff",
    radius: 18,
    width: 390,
    height: 700,
    quality: "Medium",
    resolution: "720p",
    elements: []
};


/* ==========================================
   INIT
========================================== */

document.addEventListener("DOMContentLoaded", function(){

    loadProjectFromStorage();

    const params = new URLSearchParams(location.search);

    const type = params.get("type");

    if(type){

        if(type === "app"){
            project.type = "app";
        }

        if(type === "game"){
            project.type = "game2d";
        }

        if(type === "game2d"){
            project.type = "game2d";
        }

        if(type === "game3d"){
            project.type = "game3d";
        }

    }

    updateUI();

});


/* ==========================================
   LOAD PROJECT
========================================== */

function loadProjectFromStorage(){

    try{

        const saved = localStorage.getItem("ghost_builder_current_project");

        if(saved){

            const data = JSON.parse(saved);

            project = {
                ...project,
                ...data
            };

        }

    }catch(error){

        console.log("Project load error:",error);

    }

}


/* ==========================================
   UPDATE UI
========================================== */

function updateUI(){

    document.getElementById("projectName").value = project.name;

    document.getElementById("projectNameTop").textContent =
        project.name;

    document.getElementById("titleInput").value =
        project.title;

    document.getElementById("descriptionInput").value =
        project.description;

    document.getElementById("buttonInput").value =
        project.button;

    document.getElementById("bgColor").value =
        project.background;

    document.getElementById("primaryColor").value =
        project.primary;

    document.getElementById("radius").value =
        project.radius;

    document.getElementById("canvasWidth").value =
        project.width;

    document.getElementById("canvasHeight").value =
        project.height;

    document.getElementById("projectType").value =
        project.type;

    document.getElementById("quality").value =
        project.quality;

    document.getElementById("resolution").value =
        project.resolution;

    updateProjectType();

    renderCanvas();

}


/* ==========================================
   PROJECT NAME
========================================== */

function changeProjectName(value){

    project.name =
        value || "پروژه جدید";

    document.getElementById("projectNameTop").textContent =
        project.name;

    saveProject(false);

}


/* ==========================================
   PROJECT TYPE
========================================== */

function changeProjectType(value){

    project.type = value;

    updateProjectType();

    saveProject(false);

}


function updateProjectType(){

    let text = "Website Builder";

    if(project.type === "app"){
        text = "App Builder";
    }

    if(project.type === "game2d"){
        text = "2D Game Builder";
    }

    if(project.type === "game3d"){
        text = "3D Game Builder";
    }

    document.getElementById("projectTypeTop").textContent =
        text;

    const device =
        document.getElementById("device");

    device.classList.remove("web","app","game");

    if(project.type === "website"){
        device.classList.add("web");
    }

    if(project.type === "app"){
        device.classList.add("app");
    }

    if(project.type === "game2d" || project.type === "game3d"){
        device.classList.add("game");
    }

}

   TITLE

function changeTitle(value){

    project.title =
        value || "پروژه جدید";

    document.getElementById("heroTitle").textContent =
        project.title;

    saveProject(false);

}

    saveProject(false);

}


/* ==========================================
   BUTTON
========================================== */

function changeButton(value){

    project.button =
        value;

    document.getElementById("heroButton").textContent =
        value;

    saveProject(false);

}


/* ==========================================
   BACKGROUND
========================================== */

function changeBackground(value){

    document.getElementById("previewContent").style.background =

/* ==========================================
   PRIMARY COLOR
========================================== */

function changePrimary(value){

    saveProject(false);

}


/* ==========================================

========================================== */

function changeRadius(value){

   CANVAS SIZE
========================================== */

function changeCanvasSize(){

/* ==========================================
   ADD ELEMENT
========================================== */

function addElement(type){

    const content =
        document.getElementById("previewContent");

    const element =
        document.createElement("div");

    element.style.marginTop =
        "15px";

    element.style.padding =
        "15px";

    element.style.borderRadius =
        "10px";

    element.style.border =
        "1px solid #ddd";

    if(type === "text"){

        element.textContent =
            "متن جدید";

    }

    if(type === "button"){

        element.textContent =
            "دکمه جدید";

        element.style.background =
            project.primary;

        element.style.color =
            "#fff";

        element.style.display =
            "inline-block";

        element.style.border =
            "none";

    }

    if(type === "card"){

        element.innerHTML =
            "<strong>کارت جدید</strong><br><small>توضیحات کارت</small>";

        element.style.background =
            "#f5f5f5";

    }

    if(type === "image"){

        element.innerHTML =
            "🖼️<br><small>محل تصویر</small>";

        element.style.textAlign =
            "center";

    }

    if(type === "input"){

        element.innerHTML =
            "<input placeholder='متن خود را وارد کنید' style='width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;'>";

    }

    if(type === "section"){

        element.innerHTML =
            "<h2>بخش جدید</h2><p>محتوای بخش جدید</p>";

        element.style.background =
            "#fafafa";

    }

    content.appendChild(element);

    project.elements.push({
        type:type
    });

    saveProject(false);

    showToast("جزء جدید اضافه شد ✓");

}


/* ==========================================
   RENDER
========================================== */

function renderCanvas(){

    const content =
        document.getElementById("previewContent");

    content.style.background =
        project.background;

    document.getElementById("heroTitle").textContent =
        project.title;

    document.getElementById("heroText").textContent =
        project.description;

    document.getElementById("heroButton").textContent =
        project.button;

    document.getElementById("heroButton").style.background =
        project.primary;

    document.getElementById("device").style.borderRadius =
        project.radius + "px";

    if(project.elements && project.elements.length){

        project.elements.forEach(item => {
            addElementVisual(item.type);
        });

    }

}


/* ==========================================
   VISUAL ELEMENT
========================================== */

function addElementVisual(type){

    const content =
        document.getElementById("previewContent");

    const element =
        document.createElement("div");

    element.style.marginTop =
        "15px";

    element.style.padding =
        "15px";

        "10px";

        element.textContent = "دکمه جدید";

            "🖼️<br><small>محل تصویر</small>";
    }

    if(type === "input"){

}


/* ==========================================
   TOOL
========================================== */

function selectTool(button,type){

    document.querySelectorAll(".tool")
        .forEach(item => item.classList.remove("active"));

    button.classList.add("active");

    if(type !== "select"){
        addElement(type === "game" ? "section" : type);
    }

}


/* ==========================================
   PROPERTIES MOBILE
========================================== */

function toggleProperties(){

    document
        .getElementById("properties")
        .classList.toggle("open");

}


/* ==========================================
   SAVE
========================================== */

function saveProject(showMessage=true){

    project.quality =
        document.getElementById("quality").value;

    project.resolution =
        document.getElementById("resolution").value;

    localStorage.setItem(
        "ghost_builder_current_project",
        JSON.stringify(project)
    );

    let projects = [];

    try{
        projects =
            JSON.parse(
                localStorage.getItem("ghost_builder_projects")
            ) || [];
    }catch(e){
        projects = [];
    }

    const existing =
        projects.findIndex(
            p => p.id === project.id
        );

    if(existing >= 0){
        projects[existing] = project;
    }else{
        projects.push(project);
    }

    localStorage.setItem(
        "ghost_builder_projects",
        JSON.stringify(projects)
    );

    if(showMessage){
        showToast("پروژه ذخیره شد ✓");
    }

}


/* ==========================================
   PREVIEW
========================================== */

function previewProject(){

    saveProject(false);

    location.href =
        "preview.html?project=" +
        encodeURIComponent(project.id);

}


/* ==========================================
   BUILD MODAL
========================================== */

function openBuildModal(){

    saveProject(false);

    document
        .getElementById("buildModal")
        .classList.add("show");

}


function closeBuildModal(){

    document
        .getElementById("buildModal")
        .classList.remove("show");

}


/* ==========================================
   BUILD WEB
========================================== */

function buildWeb(){

    saveProject(false);

    localStorage.setItem(
        "ghost_builder_build_type",
        "web"
    );

    location.href =
        "publish.html?type=web&project=" +
        encodeURIComponent(project.id);

}


/* ==========================================
   BUILD APK
========================================== */

function buildAPK(){

    saveProject(false);

    localStorage.setItem(
        "ghost_builder_build_type",
        "apk"
    );

    location.href =
        "publish.html?type=apk&project=" +

}


/* ==========================================
   BACK
========================================== */

function goBack(){

    if(document.referrer){
        history.back();
    }else{
        location.href = "index.html";
    }

}


/* ==========================================
   TOAST
========================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2500);

}


/* ==========================================
   ESCAPE MODAL
========================================== */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){
        closeBuildModal();
    }

});

</script>
