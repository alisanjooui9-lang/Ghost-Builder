<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ghost Builder — ویرایشگر</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-logo">
        G
      </div>

      <div>
        <div class="brand-name">
          Ghost Builder
        </div>

        <div class="brand-subtitle">
          ویرایشگر پروژه
        </div>
      </div>

    </div>


    <div class="nav-title">
      پروژه
    </div>

    <nav class="nav">

      <a href="index.html">
        <span class="nav-icon">🏠</span>
        <span>داشبورد</span>
      </a>

      <a href="projects.html">
        <span class="nav-icon">📁</span>
        <span>پروژه‌ها</span>
      </a>

      <a href="templates.html">
        <span class="nav-icon">🎨</span>
        <span>قالب‌ها</span>
      </a>

    </nav>


    <div class="nav-title">
      ابزارها
    </div>

    <div class="nav">

      <button
        onclick="addElement('text')">
        <span class="nav-icon">T</span>
        <span>متن</span>
      </button>

      <button
        onclick="addElement('button')">
        <span class="nav-icon">🔘</span>
        <span>دکمه</span>
      </button>

      <button
        onclick="addElement('card')">
        <span class="nav-icon">▣</span>
        <span>کارت</span>
      </button>

      <button
        onclick="addElement('image')">
        <span class="nav-icon">🖼️</span>
        <span>تصویر</span>
      </button>

      <button
        onclick="addElement('input')">
        <span class="nav-icon">⌨️</span>
        <span>ورودی</span>
      </button>

      <button
        onclick="addElement('section')">
        <span class="nav-icon">▤</span>
        <span>بخش</span>
      </button>

    </div>


    <div class="nav-title">
      مدیریت
    </div>

    <nav class="nav">

      <a href="media.html">
        <span class="nav-icon">🖼️</span>
        <span>رسانه‌ها</span>
      </a>

      <a href="settings.html">
        <span class="nav-icon">⚙️</span>
        <span>تنظیمات</span>
      </a>

      <a href="help.html">
        <span class="nav-icon">❓</span>
        <span>راهنما</span>
      </a>

    </nav>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="topbar-left">

        <button
          class="btn btn-small"
          onclick="goBack()">
          ← بازگشت
        </button>

        <div>

          <div
            class="page-title"
            id="topProjectName">
            پروژه جدید
          </div>

          <div
            class="page-subtitle"
            id="topProjectType">
            وب‌سایت
          </div>

        </div>

      </div>


      <div class="topbar-right">

        <button
          class="btn"
          onclick="saveProject(true)"
          data-save-project>
          💾 ذخیره
        </button>

        <button
          class="btn"
          onclick="openPreview()">
          👁️ پیش‌نمایش
        </button>

        <button
          class="btn btn-primary"
          onclick="openPublish()">
          🚀 انتشار
        </button>

      </div>

    </header>


    <!-- =================================================
         BUILDER LAYOUT
         ================================================= -->

    <div class="builder-layout">


      <!-- =================================================
           LEFT TOOLBAR
           ================================================= -->

      <aside class="builder-sidebar">

        <div class="builder-section">

          <div class="builder-section-title">
            ابزارها
          </div>


          <div class="tool-grid">

            <button
              class="tool"
              onclick="addElement('text')">

              <div style="font-size:20px">
                T
              </div>

              متن

            </button>


            <button
              class="tool"
              onclick="addElement('button')">

              <div style="font-size:20px">
                🔘
              </div>

              دکمه

            </button>


            <button
              class="tool"
              onclick="addElement('card')">

              <div style="font-size:20px">
                ▣
              </div>

              کارت

            </button>


            <button
              class="tool"
              onclick="addElement('image')">

              <div style="font-size:20px">
                🖼️
              </div>

              تصویر

            </button>


            <button
              class="tool"
              onclick="addElement('input')">

              <div style="font-size:20px">
                ⌨️
              </div>

              ورودی

            </button>


            <button
              class="tool"
              onclick="addElement('section')">

              <div style="font-size:20px">
                ▤
              </div>

              بخش

            </button>

          </div>

        </div>


        <div class="builder-section">

          <div class="builder-section-title">
            نوع پروژه
          </div>

          <select
            class="form-select"
            id="projectType"
            onchange="changeProjectType()">

            <option value="website">
              🌐 وب‌سایت
            </option>

            <option value="app">
              📱 اپلیکیشن
            </option>

            <option value="game2d">
              🎮 بازی 2D
            </option>

            <option value="game3d">
              🕹️ بازی 3D
            </option>

          </select>

        </div>


        <div class="builder-section">

          <div class="builder-section-title">
            حالت نمایش
          </div>

          <div class="tool-grid">

            <button
              class="tool active"
              onclick="setDevice('mobile', this)">
              📱
              <br>
              موبایل
            </button>

            <button
              class="tool"
              onclick="setDevice('tablet', this)">
              ▣
              <br>
              تبلت
            </button>

            <button
              class="tool"
              style="grid-column:1/-1"
              onclick="setDevice('desktop', this)">
              🖥️
              دسکتاپ
            </button>

          </div>

        </div>


        <div class="builder-section">

          <div class="builder-section-title">
            امکانات سریع
          </div>

          <button
            class="btn"
            style="width:100%;margin-bottom:7px"
            onclick="clearElements()">
            🗑️ پاک کردن عناصر
          </button>

          <button
            class="btn"
            style="width:100%"
            onclick="loadSampleElements()">
            ✨ نمونه آماده
          </button>

        </div>

      </aside>


      <!-- =================================================
           CENTER CANVAS
           ================================================= -->

      <section class="builder-center">

        <div
          id="deviceFrame"
          class="device-frame mobile">

          <div
            id="canvas"
            class="canvas">

          </div>

        </div>

      </section>


      <!-- =================================================
           RIGHT PROPERTIES
           ================================================= -->

      <aside class="properties-panel">


        <!-- PROJECT -->

        <div class="builder-section">

          <div class="builder-section-title">
            پروژه
          </div>


          <div class="form-group">

            <label class="form-label">
              نام پروژه
            </label>

            <input
              id="projectName"
              class="form-input"
              type="text"
              placeholder="نام پروژه"
              oninput="updateProjectName(this.value)">

          </div>


          <div class="form-group">

            <label class="form-label">
              عنوان
            </label>

            <input
              id="projectTitle"
              class="form-input"
              type="text"
              placeholder="عنوان پروژه"
              oninput="updateProjectField('title', this.value)">

          </div>


          <div class="form-group">

            <label class="form-label">
              توضیحات
            </label>

            <textarea
              id="projectDescription"
              class="form-textarea"
              placeholder="توضیحات پروژه"
              oninput="updateProjectField('description', this.value)">
            </textarea>

          </div>


          <div class="form-group">

            <label class="form-label">
              متن دکمه
            </label>

            <input
              id="projectButton"
              class="form-input"
              type="text"
              oninput="updateProjectField('button', this.value)">

          </div>

        </div>


        <!-- COLORS -->

        <div class="builder-section">

          <div class="builder-section-title">
            ظاهر
          </div>


          <div class="form-group">

            <label class="form-label">
              رنگ پس‌زمینه
            </label>

            <input
              id="backgroundColor"
              class="form-input"
              type="color"
              onchange="updateProjectField('background', this.value)"
              style="height:45px;padding:5px">

          </div>


          <div class="form-group">

            <label class="form-label">
              رنگ اصلی
            </label>

            <input
              id="primaryColor"
              class="form-input"
              type="color"
              onchange="updateProjectField('primary', this.value)"
              style="height:45px;padding:5px">

          </div>


          <div class="form-group">

            <label class="form-label">
              گردی گوشه‌ها
            </label>

            <input
              id="radius"
              class="form-input"
              type="range"
              min="0"
              max="50"
              value="18"
              oninput="updateProjectField('radius', Number(this.value))">

            <div
              style="font-size:11px;color:var(--muted)"
              id="radiusValue">
              18px
            </div>

          </div>

        </div>


        <!-- CANVAS -->

        <div class="builder-section">

          <div class="builder-section-title">
            اندازه صفحه
          </div>


          <div class="grid grid-2">

            <div class="form-group">

              <label class="form-label">
                عرض
              </label>

              <input
                id="canvasWidth"
                class="form-input"
                type="number"
                value="390"
                onchange="updateCanvasSize()">

            </div>


            <div class="form-group">

              <label class="form-label">
                ارتفاع
              </label>

              <input
                id="canvasHeight"
                class="form-input"
                type="number"
                value="700"
                onchange="updateCanvasSize()">

            </div>

          </div>

        </div>


        <!-- QUALITY -->

        <div class="builder-section">

          <div class="builder-section-title">
            کیفیت خروجی
          </div>


          <div class="form-group">

            <label class="form-label">
              کیفیت گرافیک
            </label>

            <select
              id="quality"
              class="form-select"
              onchange="updateProjectField('quality', this.value)">

              <option value="Low">
                Low
              </option>

              <option value="Medium">
                Medium
              </option>

              <option value="High">
                High
              </option>

              <option value="Ultra">
                Ultra
              </option>

              <option value="Custom">
                Custom
              </option>

            </select>

          </div>


          <div class="form-group">

            <label class="form-label">
              رزولوشن
            </label>

            <select
              id="resolution"
              class="form-select"
              onchange="updateProjectField('resolution', this.value)">

              <option value="480p">
                480p
              </option>

              <option value="720p">
                720p
              </option>

              <option value="1080p">
                1080p
              </option>

              <option value="1440p">
                1440p
              </option>

              <option value="2160p">
                2160p
              </option>

              <option value="4K">
                4K
              </option>

            </select>

          </div>

        </div>


        <!-- SELECTED ELEMENT -->

        <div
          class="builder-section"
          id="elementProperties">

          <div class="builder-section-title">
            عنصر انتخاب‌شده
          </div>

          <div
            id="selectedElementInfo"
            style="
            color:var(--muted);
            font-size:12px;
            ">
            هنوز عنصری انتخاب نشده است.
          </div>

        </div>

      </aside>

    </div>

  </main>

</div>


<!-- =====================================================
     SCRIPT
     ===================================================== -->

<script src="app.js"></script>

<script>

"use strict";


/* =====================================================
   STATE
   ===================================================== */

let project = null;

let selectedElementId = null;

let currentDevice = "mobile";


/* =====================================================
   GET PROJECT
   ===================================================== */

function getProjectFromURL() {

  const projectId =
    gbParam("project");


  if (projectId) {

    const found =
      gbFindProject(projectId);

    if (found) {

      gbSetCurrentProject(
        found
      );

      return found;

    }

  }


  const current =
    gbGetCurrentProject();


  if (current) {
    return current;
  }


  return gbCreateProject({
    type:
      gbParam("type") ||
      "website"
  });

}


/* =====================================================
   INIT
   ===================================================== */

function initBuilder() {

  project =
    getProjectFromURL();


  if (!project.elements) {
    project.elements = [];
  }


  fillProjectForm();

  renderCanvas();

}


/* =====================================================
   FILL FORM
   ===================================================== */

function fillProjectForm() {

  if (!project) {
    return;
  }


  document.getElementById(
    "topProjectName"
  ).textContent =
    project.name;


  document.getElementById(
    "topProjectType"
  ).textContent =
    gbProjectTypeLabel(
      project.type
    );


  document.getElementById(
    "projectName"
  ).value =
    project.name || "";


  document.getElementById(
    "projectTitle"
  ).value =
    project.title || "";


  document.getElementById(
    "projectDescription"
  ).value =
    project.description || "";


  document.getElementById(
    "projectButton"
  ).value =
    project.button || "";


  document.getElementById(
    "projectType"
  ).value =
    project.type ||
    "website";


  document.getElementById(
    "backgroundColor"
  ).value =
    project.background ||
    "#ffffff";


  document.getElementById(
    "primaryColor"
  ).value =
    project.primary ||
    "#7c5cff";


  document.getElementById(
    "radius"
  ).value =
    project.radius ?? 18;


  document.getElementById(
    "radiusValue"
  ).textContent =
    (project.radius ?? 18) +
    "px";


  document.getElementById(
    "canvasWidth"
  ).value =
    project.width ||
    390;


  document.getElementById(
    "canvasHeight"
  ).value =
    project.height ||
    700;


  document.getElementById(
    "quality"
  ).value =
    project.quality ||
    "Medium";


  document.getElementById(
    "resolution"
  ).value =
    project.resolution ||
    "720p";

}


/* =====================================================
   PROJECT NAME
   ===================================================== */

function updateProjectName(value) {

  project.name =
    value ||
    "پروژه جدید";


  document.getElementById(
    "topProjectName"
  ).textContent =
    project.name;


  autoSave();

}


/* =====================================================
   PROJECT FIELD
   ===================================================== */

function updateProjectField(
  field,
  value
) {

  project[field] =
    value;


  if (
    field ===
    "radius"
  ) {

    document.getElementById(
      "radiusValue"
    ).textContent =
      value +
      "px";

  }


  autoSave();

  renderCanvas();

}


/* =====================================================
   PROJECT TYPE
   ===================================================== */

function changeProjectType() {

  const type =
    document.getElementById(
      "projectType"
    ).value;


  project.type =
    type;


  document.getElementById(
    "topProjectType"
  ).textContent =
    gbProjectTypeLabel(
      type
    );


  autoSave();

  renderCanvas();

}


/* =====================================================
   CANVAS SIZE
   ===================================================== */

function updateCanvasSize() {

  const width =
    Number(
      document.getElementById(
        "canvasWidth"
      ).value
    );


  const height =
    Number(
      document.getElementById(
        "canvasHeight"
      ).value
    );


  project.width =
    width || 390;


  project.height =
    height || 700;


  renderCanvas();

  autoSave();

}


/* =====================================================
   ADD ELEMENT
   ===================================================== */

function addElement(type) {

  if (!project) {
    return;
  }


  const element =
    gbCreateElement(
      type
    );


  project.elements.push(
    element
  );


  selectedElementId =
    element.id;


  renderCanvas();

  renderSelectedElement();

  autoSave();


  gbToast(
    "عنصر اضافه شد.",
    "success"
  );

}


/* =====================================================
   REMOVE ELEMENT
   ===================================================== */

function removeElement(id) {

  project.elements =
    project.elements.filter(
      element =>
        element.id !== id
    );


  if (
    selectedElementId === id
  ) {

    selectedElementId =
      null;

  }


  renderCanvas();

  renderSelectedElement();

  autoSave();

}


/* =====================================================
   CLEAR
   ===================================================== */

function clearElements() {

  if (
    project.elements.length ===
    0
  ) {

    gbToast(
      "عنصری برای حذف وجود ندارد.",
      "warning"
    );

    return;

  }


  gbConfirm(
    "همه عناصر این پروژه حذف شوند؟",
    confirmed => {

      if (!confirmed) {
        return;
      }


      project.elements = [];

      selectedElementId = null;

      renderCanvas();

      renderSelectedElement();

      autoSave();


      gbToast(
        "عناصر حذف شدند.",
        "success"
      );

    }
  );

}


/* =====================================================
   SAMPLE
   ===================================================== */

function loadSampleElements() {

  project.elements = [

    gbCreateElement(
      "text",
      {
        text:
          project.title ||
          "به Ghost Builder خوش آمدید",

        fontSize: 28,

        color:
          "#111111"
      }
    ),


    gbCreateElement(
      "text",
      {
        text:
          project.description ||
          "این یک پروژه نمونه است.",

        fontSize: 15,

        color:
          "#555555"
      }
    ),


    gbCreateElement(
      "button",
      {
        text:
          project.button ||
          "شروع کنید",

        color:
          project.primary ||
          "#7c5cff"
      }
    ),


    gbCreateElement(
      "card",
      {
        title:
          "ویژگی‌های پروژه",

        description:
          "این کارت توسط Ghost Builder ساخته شده است."
      }
    )

  ];


  selectedElementId =
    project.elements[0]?.id ||
    null;


  renderCanvas();

  renderSelectedElement();

  autoSave();


  gbToast(
    "نمونه آماده اضافه شد.",
    "success"
  );

}


/* =====================================================
   RENDER CANVAS
   ===================================================== */

function renderCanvas() {

  const canvas =
    document.getElementById(
      "canvas"
    );


  const frame =
    document.getElementById(
      "deviceFrame"
    );


  if (!canvas || !frame) {
    return;
  }


  frame.style.width =
    currentDevice === "mobile"
      ? Math.min(
          Number(project.width) || 390,
          390
        ) + "px"
      : currentDevice === "tablet"
        ? Math.min(
            Number(project.width) || 768,
            768
          ) + "px"
        : Math.min(
            Number(project.width) || 1100,
            1100
          ) + "px";


  frame.style.minHeight =
    Math.max(
      Number(project.height) || 700,
      currentDevice === "mobile"
        ? 700
        : 500
    ) + "px";


  canvas.style.background =
    project.background ||
    "#ffffff";


  canvas.style.borderRadius =
    (project.radius ?? 18) +
    "px";


  canvas.innerHTML = "";


  /* -----------------------------------------------
     Default Project Header
     ----------------------------------------------- */

  if (
    project.elements.length ===
    0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.style.padding =
      "45px 25px";

    empty.style.textAlign =
      "center";

    empty.innerHTML = `

      <div style="
        font-size:48px;
        margin-bottom:15px;
      ">
        ${
          gbProjectTypeIcon(
            project.type
          )
        }
      </div>

      <h1 style="
        font-size:26px;
        margin-bottom:8px;
      ">
        ${gbEscapeHTML(
          project.title ||
          project.name
        )}
      </h1>

      <p style="
        color:#666;
        font-size:14px;
        margin-bottom:20px;
      ">
        ${gbEscapeHTML(
          project.description ||
          "پروژه خود را بسازید."
        )}
      </p>

      <button
        style="
          background:${
            project.primary ||
            "#7c5cff"
          };
          color:white;
          border:0;
          padding:12px 22px;
          border-radius:${
            project.radius ??
            18
          }px;
          font-weight:bold;
        "
      >
        ${gbEscapeHTML(
          project.button ||
          "شروع کنید"
        )}
      </button>

    `;


    canvas.appendChild(
      empty
    );


    return;

  }


  /* -----------------------------------------------
     Dynamic Elements
     ----------------------------------------------- */

  project.elements.forEach(
    element => {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "canvas-element";


      if (
        selectedElementId ===
        element.id
      ) {

        wrapper.classList.add(
          "selected"
        );

      }


      wrapper.dataset.id =
        element.id;


      wrapper.onclick =
        event => {

          event.stopPropagation();

          selectElement(
            element.id
          );

        };


      /* TEXT */

      if (
        element.type ===
        "text"
      ) {

        wrapper.innerHTML = `

          <div style="
            font-size:${
              Number(
                element.fontSize ||
                20
              )
            }px;

            color:${
              element.color ||
              "#111"
            };

            font-weight:700;
          ">
            ${gbEscapeHTML(
              element.text ||
              "متن جدید"
            )}
          </div>

        `;

      }


      /* BUTTON */

      else if (
        element.type ===
        "button"
      ) {

        wrapper.innerHTML = `

          <button
            class="canvas-button"
            style="
              background:${
                element.color ||
                project.primary ||
                "#7c5cff"
              };

              color:${
                element.textColor ||
                "#fff"
              };

              border-radius:${
                project.radius ??
                18
              }px;
            "
          >
            ${gbEscapeHTML(
              element.text ||
              "دکمه"
            )}
          </button>

        `;

      }


      /* CARD */

      else if (
        element.type ===
        "card"
      ) {

        wrapper.innerHTML = `

          <div class="canvas-card"
               style="
                 border-radius:${
                   project.radius ??
                   18
                 }px;
               ">

            <h3>
              ${gbEscapeHTML(
                element.title ||
                "کارت جدید"
              )}
            </h3>

            <p style="
              margin-top:7px;
              color:#666;
              font-size:13px;
            ">
              ${gbEscapeHTML(
                element.description ||
                ""
              )}
            </p>

          </div>

        `;

      }


      /* IMAGE */

      else if (
        element.type ===
        "image"
      ) {

        if (
          element.src
        ) {

          wrapper.innerHTML = `

            <img
              src="${
                element.src
              }"
              alt="${
                gbEscapeHTML(
                  element.alt ||
                  "تصویر"
                )
              }"
              style="
                width:100%;
                max-height:280px;
                object-fit:cover;
                border-radius:${
                  project.radius ??
                  18
                }px;
              "
            >

          `;

        } else {

          wrapper.innerHTML = `

            <div style="
              min-height:150px;
              display:grid;
              place-items:center;
              background:#eef0f5;
              border-radius:${
                project.radius ??
                18
              }px;
              color:#777;
              font-size:40px;
            ">
              🖼️
            </div>

          `;

        }

      }


      /* INPUT */

      else if (
        element.type ===
        "input"
      ) {

        wrapper.innerHTML = `

          <input
            type="text"
            placeholder="${
              gbEscapeHTML(
                element.placeholder ||
                "متن خود را وارد کنید..."
              )
            }"
            style="
              width:100%;
              padding:12px;
              border:1px solid #ddd;
              border-radius:${
                project.radius ??
                18
              }px;
              outline:none;
              color:#222;
            "
          >

        `;

      }


      /* SECTION */

      else if (
        element.type ===
        "section"
      ) {

        wrapper.innerHTML = `

          <div
            class="canvas-section"
            style="
              background:${
                element.background ||
                "#f0f2f7"
              };

              border-radius:${
                project.radius ??
                18
              }px;

              min-height:140px;
            "
          >
          </div>

        `;

      }


      canvas.appendChild(
        wrapper
      );

    }
  );

}


/* =====================================================
   SELECT ELEMENT
   ===================================================== */

function selectElement(id) {

  selectedElementId =
    id;


  renderCanvas();

  renderSelectedElement();

}


/* =====================================================
   SELECTED ELEMENT PANEL
   ===================================================== */

function renderSelectedElement() {

  const container =
    document.getElementById(
      "selectedElementInfo"
    );


  if (!container) {
    return;
  }


  const element =
    project.elements.find(
      item =>
        item.id ===
        selectedElementId
    );


  if (!element) {

    container.innerHTML = `
      هنوز عنصری انتخاب نشده است.
    `;

    return;

  }


  let controls = "";


  if (
    element.type ===
    "text"
  ) {

    controls = `

      <div class="form-group">

        <label class="form-label">
          متن
        </label>

        <textarea
          class="form-textarea"
          id="selectedText"
        >${gbEscapeHTML(
          element.text || ""
        )}</textarea>

      </div>


      <div class="form-group">

        <label class="form-label">
          اندازه متن
        </label>

        <input
          class="form-input"
          id="selectedFontSize"
          type="number"
          value="${
            element.fontSize ||
            20
          }"
        >

      </div>

    `;

  }


  else if (
    element.type ===
    "button"
  ) {

    controls = `

      <div class="form-group">

        <label class="form-label">
          متن دکمه
        </label>

        <input
          class="form-input"
          id="selectedButtonText"
          value="${
            gbEscapeHTML(
              element.text ||
              "دکمه"
            )
          }"
        >

      </div>

      <div class="form-group">

        <label class="form-label">
          رنگ دکمه
        </label>

        <input
          class="form-input"
          id="selectedButtonColor"
          type="color"
          value="${
            element.color ||
            project.primary ||
            "#7c5cff"
          }"
          style="height:45px;padding:5px"
        >

      </div>

    `;

  }


  else if (
    element.type ===
    "card"
  ) {

    controls = `

      <div class="form-group">

        <label class="form-label">
          عنوان کارت
        </label>

        <input
          class="form-input"
          id="selectedCardTitle"
          value="${
            gbEscapeHTML(
              element.title ||
              ""
            )
          }"
        >

      </div>

      <div class="form-group">

        <label class="form-label">
          توضیحات
        </label>

        <textarea
          class="form-textarea"
          id="selectedCardDescription"
        >${gbEscapeHTML(
          element.description ||
          ""
        )}</textarea>

      </div>

    `;

  }


  else if (
    element.type ===
    "input"
  ) {

    controls = `

      <div class="form-group">

        <label class="form-label">
          Placeholder
        </label>

        <input
          class="form-input"
          id="selectedPlaceholder"
          value="${
            gbEscapeHTML(
              element.placeholder ||
              ""
            )
          }"
        >

      </div>

    `;

  }


  else if (
    element.type ===
    "image"
  ) {

    controls = `

      <div class="form-group">

        <label class="form-label">
          آدرس تصویر
        </label>

        <input
          class="form-input"
          id="selectedImageSrc"
          placeholder="https://..."
          value="${
            gbEscapeHTML(
              element.src ||
              ""
            )
          }"
        >

      </div>

      <button
        class="btn"
        style="width:100%;margin-bottom:8px"
        onclick="openMedia()">
        🖼️ انتخاب از رسانه‌ها
      </button>

    `;

  }


  else if (
    element.type ===
    "section"
  ) {

    controls = `

      <div class="form-group">

        <label class="form-label">
          رنگ بخش
        </label>

        <input
          class="form-input"
          id="selectedSectionColor"
          type="color"
          value="${
            element.background ||
            "#f0f2f7"
          }"
          style="height:45px;padding:5px"
        >

      </div>

    `;

  }


  container.innerHTML = `

    <div style="
      margin-bottom:12px;
      color:var(--primary-2);
      font-weight:800;
    ">
      ${gbProjectTypeLabel(
        project.type
      )}
      /
      ${element.type}
    </div>

    ${controls}

    <button
      class="btn btn-success"
      style="width:100%;margin-bottom:7px"
      onclick="applyElementChanges()">
      ✓ اعمال تغییرات
    </button>

    <button
      class="btn btn-danger"
      style="width:100%"
      onclick="deleteSelectedElement()">
      🗑️ حذف عنصر
    </button>

  `;

}


/* =====================================================
   APPLY ELEMENT
   ===================================================== */

function applyElementChanges() {

  const element =
    project.elements.find(
      item =>
        item.id ===
        selectedElementId
    );


  if (!element) {
    return;
  }


  if (
    element.type ===
    "text"
  ) {

    element.text =
      document.getElementById(
        "selectedText"
      )?.value ||
      "متن جدید";


    element.fontSize =
      Number(
        document.getElementById(
          "selectedFontSize"
        )?.value ||
        20
      );

  }


  else if (
    element.type ===
    "button"
  ) {

    element.text =
      document.getElementById(
        "selectedButtonText"
      )?.value ||
      "دکمه";


    element.color =
      document.getElementById(
        "selectedButtonColor"
      )?.value ||
      project.primary;

  }


  else if (
    element.type ===
    "card"
  ) {

    element.title =
      document.getElementById(
        "selectedCardTitle"
      )?.value ||
      "کارت جدید";


    element.description =
      document.getElementById(
        "selectedCardDescription"
      )?.value ||
      "";

  }


  else if (
    element.type ===
    "input"
  ) {

    element.placeholder =
      document.getElementById(
        "selectedPlaceholder"
      )?.value ||
      "";

  }


  else if (
    element.type ===
    "image"
  ) {

    element.src =
      document.getElementById(
        "selectedImageSrc"
      )?.value ||
      "";

  }


  else if (
    element.type ===
    "section"
  ) {

    element.background =
      document.getElementById(
        "selectedSectionColor"
      )?.value ||
      "#f0f2f7";

  }


  renderCanvas();

  renderSelectedElement();

  autoSave();


  gbToast(
    "تغییرات اعمال شد.",
    "success"
  );

}


/* =====================================================
   DELETE SELECTED
   ===================================================== */

function deleteSelectedElement() {

  if (!selectedElementId) {
    return;
  }


  const id =
    selectedElementId;


  gbConfirm(
    "این عنصر حذف شود؟",
    confirmed => {

      if (!confirmed) {
        return;
      }


      removeElement(id);

      gbToast(
        "عنصر حذف شد.",
        "success"
      );

    }
  );

}


/* =====================================================
   DEVICE
   ===================================================== */

function setDevice(
  device,
  button
) {

  currentDevice =
    device;


  const frame =
    document.getElementById(
      "deviceFrame"
    );


  frame.classList.remove(
    "mobile",
    "tablet",
    "desktop"
  );


  frame.classList.add(
    device
  );


  document
    .querySelectorAll(
      ".tool"
    )
    .forEach(
      item => {
        if (
          item.textContent.includes(
            "موبایل"
          ) ||
          item.textContent.includes(
            "تبلت"
          ) ||
          item.textContent.includes(
            "دسکتاپ"
          )
        ) {
          item.classList.remove(
            "active"
          );
        }
      }
    );


  if (button) {
    button.classList.add(
      "active"
    );
  }


  renderCanvas();

}


/* =====================================================
   SAVE
   ===================================================== */

function saveProject(
  showMessage = false
) {

  if (!project) {
    return;
  }


  gbUpdateProject(
    project
  );


  if (showMessage) {

    gbToast(
      "پروژه با موفقیت ذخیره شد.",
      "success"
    );

  }

}


/* =====================================================
   AUTO SAVE
   ===================================================== */

function autoSave() {

  gbEnableAutoSave(
    () => {

      if (!project) {
        return;
      }

      gbUpdateProject(
        project
      );

    },
    700
  );

}


/* =====================================================
   PREVIEW
   ===================================================== */

function openPreview() {

  saveProject(false);

  gbPreview(
    project.id
  );

}


/* =====================================================
   PUBLISH
   ===================================================== */

function openPublish() {

  saveProject(false);

  gbPublish(
    project.id,
    "web"
  );

}


/* =====================================================
   MEDIA
   ===================================================== */

function openMedia() {

  gbGo(
    "media.html",
    {
      project:
        project.id,

      select:
        selectedElementId
    }
  );

}


/* =====================================================
   BACK
   ===================================================== */

function goBack() {

  saveProject(false);

  window.location.href =
    "projects.html";

}


/* =====================================================
   CANVAS CLICK
   ===================================================== */

document.addEventListener(
  "click",
  event => {

    const canvas =
      document.getElementById(
        "canvas"
      );


    if (
      canvas &&
      event.target === canvas
    ) {

      selectedElementId =
        null;

      renderCanvas();

      renderSelectedElement();

    }

  }
);


/* =====================================================
   START
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    initBuilder();

  }
);

</script>

</body>
